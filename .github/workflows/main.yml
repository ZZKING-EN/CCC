name: 编译小智机器人固件
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库全部代码
        uses: actions/checkout@v4

      - name: 安装 Ubuntu 编译依赖
        run: sudo apt update && sudo apt install git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0 -y

      - name: 拉取 ESP-IDF 框架
        run: |
          git clone -b v5.1 --depth 1 https://github.com/espressif/esp-idf.git ~/esp-idf
          cd ~/esp-idf
          ./install.sh esp32s3

      - name: 编译 ESP32-S3 固件
        run: |
          source ~/esp-idf/export.sh
          cd ccc
          idf.py set-target esp32s3
          idf.py build

      - name: 打包生成的bin固件
        uses: actions/upload-artifact@v4
        with:
          name: 小智_ESP32S3_固件包
          path: ccc/build/*.bin
