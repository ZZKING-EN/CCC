name: 编译小智机器人固件

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取全部源码
        uses: actions/checkout@v4

      - name: 安装ESP-IDF环境
        uses: espressif/setup-espressif-idf@v6
        with:
          esp-idf-version: v5.1
          esp-target: esp32s3

      - name: 编译固件
        run: |
          idf.py set-target esp32s3
          idf.py build

      - name: 打包固件bin文件
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3_小智固件
          path: build/*.bin
